# Hand-written input for generate.py, which builds the capabilities table on
# content/platform/administration/iam-organizations/roles-role-bindings/capabilities-reference.md
#
# Edit this file, not the generated table. See scripts/README.md.

# The built-in roles the page documents, in the order they appear inside each
# table cell. Roles left out on purpose:
#   argos.*            partner program roles
#   gulfstream         a single controller capability
#   signing.*          experimental; every sigstore.* capability is deprecated
#   advisories.*       no Academy docs for authoring advisories through the API
#   libraries.go.*, libraries.dotnet.*, libraries.ruby.*
#                      no Academy docs for these ecosystems yet
roles = [
    "owner",
    "editor",
    "viewer",
    "limited_owner",
    "console_viewer",
    "registry.pull",
    "registry.pull_token_creator",
    "registry.push",
    "registry.editor",
    "apk.pull",
    "apk.push",
    "libraries.java.pull",
    "libraries.java.pull_token_creator",
    "libraries.java.push",
    "libraries.python.pull",
    "libraries.python.pull_token_creator",
    "libraries.python.push",
    "libraries.javascript.pull",
    "libraries.javascript.pull_token_creator",
    "libraries.javascript.push",
    "guardener.user",
    "guardener.admin",
    "sandbox.user",
    "sandbox.identity.user",
    "mcp.tool_user",
    "actions.viewer",
]

# Resources that documented roles grant but the page leaves out. owner holds
# capabilities on these, but Academy doesn't document the ecosystems yet.
omitted_resources = [
    "libraries.dotnet",
    "libraries.go",
    "libraries.ruby",
]

# The Purpose column, one entry per resource. A resource is a capability name
# without its last segment: repo.blobs.get belongs to the repo.blobs resource.
# Markdown links are allowed. Every resource that a documented role grants
# needs an entry here, and every entry needs a deployed resource.
