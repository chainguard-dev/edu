# Neutral international Spanish, pending confirmation of the target variant.
# og:locale requires a territory, so es_LA stands in until the variant is chosen.
[es]
  label = "Español"
  locale = "es"
  contentDir = "content-es"
  weight = 50
  disableKinds = ["taxonomy", "term"]
  [es.params]
    languageISO = "ES"
    titleAddition = "Base de conocimientos sobre la seguridad de la cadena de suministro de software"
    description = "Aprenda a proteger su cadena de suministro de software de forma predeterminada"
    ogLocale = "es_LA"
    schemaLocale = "es"
    kapaLanguage = "es"
    # "Preguntar a la IA" doesn't fit the floating Ask AI button's default 4.5rem width.
    kapaButtonWidth = "9.5rem"
    untranslatedHint = "(sin traducir)"
    untranslatedNotice = "Esta página aún no se ha traducido al español, por lo que está viendo la versión en inglés."
