spec:
  authorities:
    - keyless:
        url: https://fulcio.sigstore.dev
        # Accept keyless gitsign signatures from a chainguard.dev identity via
        # either the GitHub or the Google OIDC connector. Without these explicit
        # identities, commits signed through the Google connector are rejected
        # ("certificate does not satisfy any policy authority").
        identities:
          - issuer: https://github.com/login/oauth
            subjectRegExp: .+@chainguard.dev$
          - issuer: https://accounts.google.com
            subjectRegExp: .+@chainguard.dev$
          # Accept commits that these workflows sign with gitsign when they run
          # on main. Add a workflow here when it starts signing its commits.
          - issuer: https://token.actions.githubusercontent.com
            subject: https://github.com/chainguard-dev/edu/.github/workflows/digestabot.yaml@refs/heads/main
          - issuer: https://token.actions.githubusercontent.com
            subject: https://github.com/chainguard-dev/edu/.github/workflows/autodocs-platform.yaml@refs/heads/main
      ctlog:
        url: https://rekor.sigstore.dev
    - key:
        # Allow commits signed by GitHub.
        kms: https://github.com/web-flow.gpg
  # Allow Github verified ssh, gpg, and smime signatures
  github:
    verified: true
