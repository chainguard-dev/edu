version: 2
updates:
  - package-ecosystem: gomod
    directory: "./tools/chainlink"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    assignees:
      - "matthewhelmke"
    groups:
      gomod:
        update-types:
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    assignees:
      - "matthewhelmke"
    labels:
      - "dependencies"
      - "github-actions"
      - "security"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"

  # Python dependencies for documentation compilation
  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    assignees:
      - "matthewhelmke"
    labels:
      - "dependencies"
      - "security"
      - "documentation"

  # npm dependencies for the site theme and tooling (root package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    assignees:
      - "matthewhelmke"
    labels:
      - "dependencies"
      - "security"
    groups:
      # stylelint-config-standard-scss declares stylelint as a peer
      # dependency, so a stylelint major bump on its own fails `npm ci`.
      # Grouping every update type keeps the two packages in one PR.
      # Dependabot uses the first group that matches, so this group
      # must stay above the catch-all npm group.
      stylelint:
        patterns:
          - "stylelint"
          - "stylelint-*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      npm:
        update-types:
          - "minor"
          - "patch"
