version: 2
updates:
  - package-ecosystem: gomod
    directory: "./tools/rumble"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    assignees:
      - "matthewhelmke"
    groups:
      gomod:
        update-types:
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    assignees:
      - "matthewhelmke"
    labels:
      - "dependencies"
      - "github-actions"
      - "security"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"

  # Python dependencies for documentation compilation
  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    assignees:
      - "matthewhelmke"
    labels:
      - "dependencies"
      - "security"
      - "documentation"

  # npm dependencies for the site theme and tooling (root package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    assignees:
      - "matthewhelmke"
    labels:
      - "dependencies"
      - "security"
    groups:
      npm:
        update-types:
          - "minor"
          - "patch"
