name: Nginx Configuration Validation

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    if: github.repository == 'chainguard-dev/edu'

    permissions:
      contents: read

    steps:
      - name: 'Github Actions Runner'
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: 'Checkout default branch to $GITHUB_WORKSPACE dir'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Build project
        run: |
          npm ci
          npm run build

      - name: Run Nginx validation
        run: |
          docker run --rm -v "$(pwd)"/nginx.conf:/etc/nginx/nginx.conf -v "$(pwd)"/public/_aliases:/etc/nginx/aliases -v "$(pwd)"/public:/usr/share/nginx/html/ cgr.dev/chainguard/nginx:latest-dev -t

      # Run the image Cloud Run deploys and follow every redirect chain, so a
      # redirect loop (DOCS-186) or a duplicated query string (DOCS-187) fails
      # the PR that introduces it instead of reaching readers.
      - name: Start the production image
        run: |
          docker build -t edu-nginx .
          docker run -d --name edu-nginx -p 8080:8080 edu-nginx
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/ && exit 0
            sleep 1
          done
          docker logs edu-nginx
          exit 1

      - name: Check redirect chains
        run: python3 scripts/check_redirect_chains.py http://localhost:8080
