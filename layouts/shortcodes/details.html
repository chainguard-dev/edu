<details{{ with .Get 1 }} {{ . | safeHTML }}{{ end -}}>
  <summary>{{ with .Get 0 -}}{{ . | safeHTML }}{{ else -}}{{ errorf "No summary provided"}}{{ end -}}</summary>
  {{ with .Inner -}}{{ . | $.Page.RenderString (dict "display" "inline") }}{{ else -}}{{ errorf "No details provided"}}{{ end -}}
</details>
